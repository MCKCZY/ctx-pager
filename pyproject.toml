[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctx-pager"
version = "0.1.0"
description = "Three-tier paged context memory skill and zero-dependency retrieval engine for small-context AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
authors = [
  { name = "ctx-pager contributors" }
]
keywords = ["llm", "agent", "context-management", "memory", "sqlite", "fts5", "mcp", "skill"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
ctx-pager = "ctx_pager.cli:main"
ctx-pager-mcp = "ctx_pager.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
